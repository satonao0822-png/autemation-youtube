      一時的にmp4が残る → アップ後は速やかに削除推奨。
      将来 Drive for desktop 導入すれば「Finder→Driveフォルダ」D&Dで2手数に短縮可能（任意）

local_retention:
  # 設計方針: なーたんの「ローカル圧迫させたくない」を最大化
  # → 動画 mp4 はローカルに一度も載せない（Drive完結）
  keep_locally:
    - "_index.yml"               # メタ正本（軽量・必須）
    - "_tag_dictionary.yml"      # 語彙統制
    - "preview/*.jpg"            # 代表1枚（数十KB / 視覚確認用）
    - "README.md"
  never_locally:
    - "*.mp4"                    # 動画本体はローカルに保存しない
    - "*.mov"
    - "*.mkv"
  preview_size:
    max_width: 640
    quality: 85
    format: jpg
  # ローカル assets/library/02_magnific/inbox/ はフォールバック用途のみ
  # （Drive アップが何らかの理由で使えない時の代替投入口）
  local_inbox_fallback: assets/library/02_magnific/inbox/

vision_classification:
  enabled: true
  provider: anthropic
  model: claude-sonnet-4-6
  fallback_model: claude-haiku-4-5-20251001   # コスト超過時の縮退
  api_key_env: ANTHROPIC_API_KEY              # .env で設定（Phase 3）
  prompt_path: pipeline/prompts/material_classification.md

  screenshot:
    duration_sec: 10        # 動画冒頭から10秒
    frames_per_second: 1    # 1秒1枚 = 10枚
    max_frames: 10

  classification_axes:
    # 必ず判定する5+1軸
    - species              # [triceratops, tyrannosaurus, stegosaurus, ...] or []
    - period               # triassic / jurassic / cretaceous_early / cretaceous_late / unknown
    - behavior             # [walk, run, charge, eat, rest, courtship, fight, idle, landscape]
    - shot                 # wide / medium / close / part_close
    - environment          # [forest, plain, coast, volcano, river, ...]
    - light                # dawn / day / dusk / night / storm / fog
    - anatomical_ok        # true / false（false なら fallback_illustration へ）

  confidence_threshold:
    auto_classify: 0.7     # 0.7以上なら自動で species/ etc に振り分け
    uncertain: 0.4         # 0.4-0.7 は _uncertain/ に preview 配置・要目視
    reject: 0.4            # 0.4未満は _uncertain/ + 警告

cost_management:
  # ADR-010 §3
  monthly_budget_yen: 1000
  alert_threshold_yen: 800           # 80%でアラート
  hard_stop_yen: 1000                # 100%で取り込み停止・なーたん再承認まで待機
  cost_log_path: episodes/_logs/material_ingest_cost.yml
  cost_per_request_estimate_yen:
    sonnet_4_6: 8     # 1動画あたり目安
    haiku_4_5: 0.8

