  approval_threshold_yen: 5000       # 1回 / 月次見込み / サブスク月額のいずれかが5,000円超で承認必須
  approval_threshold_changed_from_yen: 10000  # 旧閾値（1万円）から厳格化
  approval_threshold_changed_at: "2026-06-09"
  approval_threshold_reason: "なーたん明示『とにかく5000円以上の決済はちゃんと俺に通すようにしてね。べらぼうに高くなるとしんどいから』"

  # 既承認の予算枠（上限内であれば追加承認不要、超過時は再承認）
  pre_approved_budgets:
    seedance_trial:
      monthly_limit_yen: 3000        # 試験枠（2026-06-09 なーたん承認）
      purpose: "Shorts動画運用80%以上の検証。EP01から本格運用前のパイロット"
      hard_stop: true                # 上限到達で自動停止
      review_after_month_count: 1    # 1ヶ月実績見て本格運用可否を再判断
      reference_adr: "ADR-013（起案中）"

    magnific_subscription:
      monthly_limit_yen: 1000        # 既契約・月額固定
      purpose: "静止画AI素材（補助用途）"
      pre_approved_at: "2026-06-02"

    fish_audio_subscription:
      monthly_limit_yen: 100         # 既契約・月額固定
      purpose: "ナレーション音声合成"
      pre_approved_at: "2026-06-02"

    gpt_image_2:
      monthly_limit_yen: 2000        # 静止画補助（マスター設定画・断面図等）の上振れ上限
      purpose: "Seedance I2V用マスター画像・Magnific在庫不足の補完"
      hard_stop: false               # 必要時は事前共有で運用
      pre_approved_at: "2026-06-09"

    material_ingest:
      monthly_limit_yen: 1000        # storage.yml §cost_management と同じ・素材投入量依存
      purpose: "Drive _inbox/ 動画の自動分類（Sonnet 4.6/Haiku 4.5）"
      pre_approved_at: "2026-06-08"

  # 想定月額合計（Shortsのみ運用・初月・標準シナリオ）
  estimated_monthly_total_yen:
    minimum: 1100                    # 固定費のみ（変動費ゼロ）
    standard: 6000                   # 標準想定
    maximum: 7100                    # 全変動費上限張り付き
    reference: "Phase 1 Shorts 16本/月・長尺なし"

trigger:
  # material-ingest skill の発火タイミング
  default: manual                    # なーたんが「振り分けて」と言う
  watch_source: drive_inbox          # Drive 上の _inbox/ サブフォルダを見る
  alternatives:
    - drive_inbox_polling            # Drive API で _inbox/ を定期ポーリング
    - cron_hourly                    # 毎時実行
    - local_fallback                 # ローカル inbox/ も併用
  current: manual                    # Phase 3 開始時の暫定

  skill_processing_flow:
    # skill が起動した時の処理ステップ（Phase 3 実装時の参照）
    - "Drive _inbox/ から未処理 mp4 をリスト"
    - "1動画ずつ /tmp に一時DL"
    - "ffmpeg で 10枚スクショ抽出（/tmp）"
    - "Claude Vision Sonnet 4.6 で判定"
    - "Drive 上で _inbox/ から species/{x}/ 等へ移動（Drive API files.update parents）"
    - "preview をローカル preview/ に保存"
    - "_index.yml / _metadata.md に追記"
    - "/tmp 一時ファイル削除"
    - "コストログに追記"

metadata_sync:
  # _metadata.md（人間向けライセンス台帳）と _index.yml（機械可読）両方に書く
  human_readable_path: assets/library/_metadata.md
  machine_readable_path: assets/library/02_magnific/_index.yml
  sync_policy: "material-ingest skill が両方に同時追記する。手動で片方だけ更新しないこと"
