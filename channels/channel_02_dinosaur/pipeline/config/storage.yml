    drive_subfolder: "_inbox/"
    full_url: "https://drive.google.com/drive/folders/1PRy9c_Qm5_f4Hc7k1eTushVWLk420De5"
    upload_method: drive_web_ui   # 2026-06-08 確定: なーたんは Drive Web UI 派
