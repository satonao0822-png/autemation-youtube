# video_sources.yml — 映像3ソース戦略
# 根拠: ADR-007（戦略本体）/ ADR-011（配分見直し・運用方針）
# 2026-06-08 ADR-011: Magnific 抑制 + フリー素材主軸 + Seedance 種別主役 への運用解釈変更

# 配分目安（本数 ≒ 尺ベース）— 2026-06-08 ADR-011 で更新
allocation:
  freestock_pct: 50   # 無料ストック（汎用素材主軸に格上げ）
  magnific_pct: 15    # Magnific（種別の補助カットに抑制）
  seedance_pct: 35    # Seedance（種別主役・API再開後）
  # 旧（ADR-007）: freestock 25 / magnific 35 / seedance 40

usage_policy:
  # ADR-011 で確定した運用方針
  freestock:
    role: "汎用素材の主軸（環境・トランジション・抽象・Bロール）"
    why: "ライセンス費ゼロ・量が多い・恐竜chの汎用領域はフリーで完結"
  magnific:
    role: "種別の補助カット（種別不問の脇役・抽象的恐竜カット）"
    why: "種別優先方針（ADR-011）。汎用生成は抑制"
    generation_restraint: true
  seedance:
    role: "種別の主役カット（特定種のダイナミックな動き）"
    why: "API課金のリソースは主役カットに集中"

sources:
  freestock:
    enabled: true
    candidates:
      - name: pexels
        api: true
        license: "Pexels License"
      - name: pixabay
        api: true
        license: "Pixabay Content License"
    library_path: assets/library/01_freestock
    categories:
      - abstract
      - general
      - historical
      - museum
      - nature
      - space

  magnific:
    enabled: true
    contract: "月約1000円のプラン契約済（なーたん名義）"
    library_path: assets/library/02_magnific
    categories:
      - dinosaur_bg
      - general
      - nature
      - transitions

  seedance:
    # 2026-06-07 ADR-009: 採用は確定。API実装・課金再開は将来
    # 当面は他フリー素材サイト併用で本数を回す
    enabled: false
    adopted: true              # 採用確定（実装フェーズだけ将来）
    paused_at: "2026-06-04"
    pause_reason: "API課金停止。プロンプト設計・運用フロー設計を先行整備"
    resume_conditions:
      - "台本・音声・素材が揃った時点で予算判断"
      - "BytePlus アカウント開設 + クレカ登録 + 予算枠承認"
    quality_gate:
      ep01_acceptance_rate_min: 0.70  # EP01単体70%必達（厳しめ運用）
      gate_decision_date: "2026-06-04"
      gate_decision_by: "naatan"
    library_path: assets/library/03_seedance

  free_stock_sites_extended:
    # フリー素材サイトの追加選定は将来（ADR-009）
    # 当面は freestock セクションで挙げた Pexels/Pixabay と既存 assets/library を運用
    enabled: false
    selection_pending: true
    selection_note: "Seedance 実装と並行して候補サイトを評価。学術整合性・恐竜素材の量・ライセンスを基準に選定"

# 破綻カット差し替え（学術ガード）
fallback_to_illustration:
  enabled: true
  rule: "解剖学的・行動学的にアウトな破綻パターン（指の本数・歯列・羽毛の有無・運動様式）を検出したら図解・復元画・化石写真に差し替え"
  judged_by: dinosaur-pm

scene_constraints:
  # nishi 提案 §9-2（映像制約3点）
  - 複数種同居最小化
  - クロースアップ回避
  - 仮説動作の断定回避
